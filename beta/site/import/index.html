<!DOCTYPE html>
<html lang="en">

<head>
  <title>KaraokeType</title>
  <link rel="stylesheet" href="../../../play/style.css">
</head>

<body>
  <div class="container">
    <div class="heading">
      <ul>
        <li>KaraokeType</li>
      </ul>
    </div>
    <div class="header">
      <div class="errors">
        <div class="header_text">Score</div>
        <div class="curr_errors">0</div>
      </div>
      <div class="timer">
        <div class="header_text">Time</div>
        <div class="curr_time">60s</div>
      </div>
      <div class="accuracy">
        <div class="header_text">Accuracy</div>
        <div class="curr_accuracy">100%</div>
      </div>
    </div>

    <div class="quote_copy">Test terrain</div>
    <div class="input_area">
      <input type="file" id="file-selector" accept=".json"/>
    </div>
  <script src="import_lrc.js"></script>
</body>

</html>
