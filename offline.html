  /* Other */
  ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #3a3a3a;
  text-align: center;
}

li {
  float: unset;
  margin-bottom: 20px;
  font-size: 3rem;
  color: white;
  font-family: system-ui;
  text-align: center;
}

body {
  background-color: #4a4a4a;
  color: black;
  text-align: center;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.heading {
  margin-bottom: 20px;
  font-size: 3rem;
  color: white;
  font-family: system-ui;
  width: 100%;
  text-align: center;
}

.header {
  display: flex;
  align-items: center;
}

.timer,
.errors,
.accuracy,
.cpm,
.wpm {
  background-color: #3a3a3a;
  height: 60px;
  width: 110px;
  margin: 8px;
  padding: 12px;
  border-radius: 20%;
  box-shadow: black 3px 6px 3px;
  color: white;
  font-family: system-ui;
}

.cpm {
  display: none;
}

.header_text {
  text-transform: uppercase;
  font-size: 0.6rem;
  font-weight: 600;
}

.curr_time,
.curr_errors,
.curr_accuracy,
.curr_cpm,
.curr_wpm {
  font-size: 1vw;
}

.quote {
  background-color: #3a3a3a;
  font-size: 1.5rem;
  margin: 10px;
  padding: 25px;
  box-shadow: black 5px 8px 5px;
  color: white;
  font-family: system-ui;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -khtml-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

.quote_f {
  background-color: #3a3a3a;
  font-size: 1.5rem;
